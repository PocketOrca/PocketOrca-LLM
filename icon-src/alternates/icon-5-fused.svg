<svg xmlns="http://www.w3.org/2000/svg" width="432" height="432" viewBox="0 0 108 108">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10182a"/>
      <stop offset="1" stop-color="#0a0d14"/>
    </linearGradient>
    <linearGradient id="bolt5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="108" height="108" fill="url(#bg5)"/>

  <!-- chip outline (from #1) — quiet, no pins, just the frame -->
  <g transform="translate(54,47)">
    <rect x="-31" y="-31" width="62" height="62" rx="12" fill="none" stroke="#25314a" stroke-width="2.5"/>
    <!-- corner accents only (chip feel, not busy pins) -->
    <g stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round">
      <path d="M -20 -31 v 0" /><path d="M -24 -31 h 6"/>
      <path d="M 24 -31 h -6"/>
      <path d="M -31 24 v -6"/><path d="M 31 18 v 6"/>
    </g>
    <!-- AN monogram -->
    <text x="0" y="2" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="30" font-weight="700" fill="#e8edf5" text-anchor="middle" dominant-baseline="middle">AN</text>
    <!-- bolt fused into the N: a small filled bolt replaces N's diagonal -->
    <path d="M 13 -14 L 5 -1 L 10 -1 L 7 14 L 16 -3 L 11 -3 Z" fill="url(#bolt5)"/>
    <!-- LM tag bottom-right inside chip -->
    <text x="18" y="24" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="8.5" font-weight="600" fill="#60a5fa" text-anchor="middle" letter-spacing="2">LM</text>
  </g>

  <!-- wordmark -->
  <text x="54" y="98" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" font-weight="600" fill="#565e6b" text-anchor="middle" letter-spacing="4">ANNPU-LM</text>
</svg>
