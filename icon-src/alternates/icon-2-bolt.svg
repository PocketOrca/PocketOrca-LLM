<svg xmlns="http://www.w3.org/2000/svg" width="432" height="432" viewBox="0 0 108 108">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a30"/>
      <stop offset="1" stop-color="#0a0f1a"/>
    </linearGradient>
    <linearGradient id="bolt2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="108" height="108" fill="url(#bg2)"/>

  <!-- big lightning bolt = speed/power, with NPU circuit traces -->
  <g transform="translate(54,54)">
    <path d="M 6 -34 L -14 6 L -2 6 L -6 34 L 16 -8 L 2 -8 Z"
          fill="url(#bolt2)" stroke="#93c5fd" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- circuit traces left -->
    <g stroke="#2c3646" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M -34 -20 h 12 l 6 6"/>
      <path d="M -34 0 h 14"/>
      <path d="M -34 20 h 12 l 6 -6"/>
      <path d="M 34 -20 h -12 l -6 6"/>
      <path d="M 34 0 h -14"/>
      <path d="M 34 20 h -12 l -6 -6"/>
    </g>
    <!-- circuit nodes -->
    <g fill="#3b82f6">
      <circle cx="-34" cy="-20" r="2.5"/><circle cx="-34" cy="0" r="2.5"/><circle cx="-34" cy="20" r="2.5"/>
      <circle cx="34" cy="-20" r="2.5"/><circle cx="34" cy="0" r="2.5"/><circle cx="34" cy="20" r="2.5"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="54" y="97" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="700" fill="#d7dce3" text-anchor="middle" letter-spacing="3">ANNPU-LM</text>
</svg>
