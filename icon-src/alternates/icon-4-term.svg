<svg xmlns="http://www.w3.org/2000/svg" width="432" height="432" viewBox="0 0 108 108">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1220"/>
      <stop offset="1" stop-color="#0a0d12"/>
    </linearGradient>
    <linearGradient id="lm4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <rect width="108" height="108" fill="url(#bg4)"/>

  <!-- terminal aesthetic: prompt glyph + cursor, minimal tool look -->
  <g font-family="ui-monospace,Menlo,Consolas,monospace">
    <!-- prompt line -->
    <text x="24" y="46" font-size="30" font-weight="700" fill="#3b82f6">&gt;_</text>
    <!-- second line: LM in gradient -->
    <text x="24" y="78" font-size="26" font-weight="700" fill="url(#lm4)" letter-spacing="1">LM</text>
    <!-- cursor block after LM -->
    <rect x="72" y="58" width="13" height="22" fill="#e5e9f0">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- thin frame -->
  <rect x="8" y="8" width="92" height="92" rx="14" fill="none" stroke="#1f2a3d" stroke-width="2"/>
</svg>
