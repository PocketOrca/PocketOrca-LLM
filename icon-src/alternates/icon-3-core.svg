<svg xmlns="http://www.w3.org/2000/svg" width="432" height="432" viewBox="0 0 108 108">
  <defs>
    <radialGradient id="bg3" cx="0.5" cy="0.35" r="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0a0d12"/>
    </radialGradient>
    <linearGradient id="core3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="108" height="108" fill="url(#bg3)"/>

  <!-- abstract NPU core: concentric rounded squares = tensor cores -->
  <g transform="translate(54,50)">
    <rect x="-34" y="-34" width="68" height="68" rx="16" fill="none" stroke="#1f2a3d" stroke-width="3"/>
    <rect x="-24" y="-24" width="48" height="48" rx="12" fill="none" stroke="#2c3e5d" stroke-width="3"/>
    <rect x="-14" y="-14" width="28" height="28" rx="8" fill="url(#core3)"/>
    <!-- core spark -->
    <circle cx="0" cy="0" r="5" fill="#dbeafe"/>
  </g>

  <!-- wordmark -->
  <text x="54" y="97" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="700" fill="#8b93a1" text-anchor="middle" letter-spacing="3">ANNPU-LM</text>
</svg>
